name: Android Release (.aab)

# Builds a signed Android App Bundle for the WyberAi app — entirely on GitHub's
# free Linux runners, with NO Expo EAS dependency. This is `expo prebuild`
# + `./gradlew bundleRelease`, i.e. exactly what EAS runs, but on our own CI.
#
# Run it manually: Actions tab → "Android Release (.aab)" → Run workflow.
# Download the result from the run's Artifacts, then upload the .aab to the
# Google Play Console.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks) — see docs/ANDROID_BUILD.md
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        type: choice
        default: release
        options: [release]

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # The full 4-ABI native build + debug symbols fills the runner's ~14 GB,
        # failing packageReleaseBundle with "No space left on device". Delete the
        # preinstalled toolchains an Android build never touches (~20-25 GB).
        run: |
          echo "== disk before =="; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          echo "== disk after =="; df -h /

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See docs/ANDROID_BUILD.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Prebuild native android/ (Expo CNG)
        run: npx expo prebuild --platform android --no-install

      - name: Raise Gradle/Kotlin JVM memory (fix Metaspace OOM)
        # Expo's generated gradle.properties caps Metaspace at 512m, which the
        # New Architecture Kotlin/C++ compile exhausts — the JVM then thrashes in
        # GC and the build times out. Appended keys override the earlier ones
        # (last value wins when Gradle loads the properties file). ubuntu-latest
        # has ~16 GB RAM, so this is comfortably within budget.
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m"
            echo "org.gradle.caching=true"
          } >> android/gradle.properties
          echo "--- effective memory settings ---"
          grep -E 'jvmargs|caching' android/gradle.properties

      - name: Place keystore for Gradle
        run: cp "$RUNNER_TEMP/upload.keystore" android/app/upload.keystore

      - name: Build signed AAB
        working-directory: android
        env:
          # EXPO_PUBLIC_* are inlined into the JS bundle by Metro during
          # bundleRelease. Set these as repo VARIABLES (Settings → Secrets and
          # variables → Actions → Variables) to enable in-app purchases. The
          # RevenueCat Android key is a PUBLIC client key, so a variable (not a
          # secret) is correct. Unset → empty → IAP stays off (safe default).
          EXPO_PUBLIC_ENABLE_IAP: ${{ vars.EXPO_PUBLIC_ENABLE_IAP }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
          # Agent-team live feed (Atlas/Forge/Prism/Sentinel/Verity) — already
          # built and ported to mobile, just gated off by default. Requires the
          # web server to also have NEXT_PUBLIC_AGENT_TEAM=true in Vercel prod,
          # since the client only renders markers the server actually emits.
          EXPO_PUBLIC_AGENT_TEAM: ${{ vars.EXPO_PUBLIC_AGENT_TEAM }}
          # Sentry DSN is not secret (same threat model as any other client-side
          # analytics key — it can only accept error reports, not read data).
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          # ORG_GRADLE_PROJECT_<name> exposes <name> as a Gradle project property,
          # which plugins/withReleaseSigning.js reads. Keystore path is relative
          # to android/app (Gradle resolves signingConfig storeFile from there).
          ORG_GRADLE_PROJECT_WYBER_UPLOAD_STORE_FILE: upload.keystore
          ORG_GRADLE_PROJECT_WYBER_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_WYBER_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_WYBER_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # bundleRelease → .aab (for Play). assembleRelease → installable .apk(s)
        # you can sideload straight to a phone (USB / download) for fast testing —
        # the .aab is a Play-only format and can't be installed directly.
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Verify AAB is signed
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Built: $AAB"
          # A signed bundle contains the v1 signature block under META-INF.
          if unzip -l "$AAB" | grep -qiE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "✓ AAB carries a signing block."
          else
            echo "::warning::Could not confirm a signature block — verify before uploading."
          fi
          echo "--- APK(s) for direct install ---"; ls -la android/app/build/outputs/apk/release/ || true

      - name: Upload AAB artifact (for Google Play)
        # retention-days is intentionally short (was 14): each build uploads a
        # ~135MB AAB+APK pair, and the org's Actions artifact storage quota is
        # small enough that ~15 accumulated runs exhausted it entirely, failing
        # every upload step with "Artifact storage quota has been hit" even
        # though the Gradle build itself succeeded. Keep this low, or clear old
        # artifacts manually (gh api -X DELETE repos/Wyberai/wyberai-mobile/actions/artifacts/<id>)
        # if it happens again.
        uses: actions/upload-artifact@v4
        with:
          name: wyberai-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 5

      - name: Upload APK artifact (sideload to phone)
        uses: actions/upload-artifact@v4
        with:
          name: wyberai-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 5

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" android/app/upload.keystore

# (re-indexed)
